services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - portfolio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ../..
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
    command: ["python", "-m", "src.infrastructure.database.cli", "migrate"]

  operator-api:
    build:
      context: ../..
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_REQUIRE_SCHEMA: "true"
      DATABASE_MIGRATIONS_DIR: migrations
      OPERATOR_RUNTIME_API_HOST: 0.0.0.0
      OPERATOR_RUNTIME_API_PORT: 8000
      OPERATOR_RUNTIME_DATABASE_REQUIRE_SCHEMA: "true"
      OPERATOR_RUNTIME_DATABASE_MIGRATIONS_DIR: migrations
      OPERATOR_RUNTIME_AUTO_CONNECT_DATABASE: "true"
      OPERATOR_API_KEYS_JSON: '{"${OPERATOR_KEY}":"${OPERATOR_ID}"}'
      OPERATOR_CORS_ORIGINS: ${OPERATOR_CORS_ORIGINS:?set OPERATOR_CORS_ORIGINS}
      PORTFOLIO_MEDIA_ROOT: /workspace/portfolio-media
    ports:
      - "127.0.0.1:${OPERATOR_API_PORT:-8000}:8000"
    volumes:
      - ${PORTFOLIO_MEDIA_DIR:-../../var/portfolio-media}:/workspace/portfolio-media:ro

volumes:
  portfolio-postgres:
