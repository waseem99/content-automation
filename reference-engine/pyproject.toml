[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codistan-reference-intelligence"
version = "0.1.0"
description = "Local-first social video ingestion, decomposition, analysis, reporting, and original brief export."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Codistan"}]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "jinja2>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.17,<1",
  "pillow>=10.4,<12",
]

[project.optional-dependencies]
media = [
  "yt-dlp>=2025.1.15",
  "opencv-python-headless>=4.10,<5",
  "scenedetect[opencv]>=0.6.5,<1",
]
speech = ["faster-whisper>=1.1,<2"]
browser = ["playwright>=1.50,<2"]
search = ["numpy>=1.26,<3", "faiss-cpu>=1.8,<2"]
vision = ["transformers>=4.47,<5", "torch>=2.4,<3"]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]
all = [
  "yt-dlp>=2025.1.15",
  "opencv-python-headless>=4.10,<5",
  "scenedetect[opencv]>=0.6.5,<1",
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "faiss-cpu>=1.8,<2",
  "playwright>=1.50,<2",
]

[project.scripts]
refintel = "refintel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["refintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
