name: P100 Acceptance Pilot

on:
  push:
    branches: [p100-acceptance-pilot]
  pull_request:
    branches: [test, p99-production-operations]
  workflow_dispatch:

concurrency:
  group: p100-acceptance-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance-pilot-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_acceptance
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_acceptance
      FOOTBALL_BRIEF_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_acceptance
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115" "httpx>=0.27" "pydantic>=2.7" "pydantic-settings>=2.3" "pytest>=8" "psycopg[binary]>=3.2,<4" "psycopg-pool>=3.2,<4" "typer>=0.12"
      - name: Compile acceptance modules API and tests
        run: |
          python -m compileall -q \
            src/application/acceptance \
            src/operator_api/acceptance_runtime.py \
            src/operator_api/acceptance_validated_runtime.py \
            src/operator_api/acceptance_revision_runtime.py \
            src/operator_api/runtime_factory.py \
            tests/unit/test_p100_acceptance_contracts.py \
            tests/integration/test_p100_acceptance_foundation.py \
            tests/integration/test_p100_acceptance_configured_app.py
      - name: Apply and verify complete migration chain
        run: |
          set -o pipefail
          { python -m src.infrastructure.database.cli migrate; python -m src.infrastructure.database.cli status; python -m src.infrastructure.database.cli health --json; } 2>&1 | tee p100-migrations.log
      - name: Run acceptance policy PostgreSQL and configured-app tests
        run: |
          set -o pipefail
          pytest -vv \
            tests/unit/test_p100_acceptance_contracts.py \
            tests/integration/test_p100_acceptance_foundation.py \
            tests/integration/test_p100_acceptance_configured_app.py \
            2>&1 | tee p100-tests.log
      - name: Prove no live delivery or deployment action exists
        run: |
          ! grep -R -n -E "execute_live_deliver[y]|submit_live_deliver[y]|vercel depl[o]y|vercel --pr[o]d|docker pus[h]|kubectl appl[y]" \
            src/application/acceptance \
            src/operator_api/acceptance_runtime.py \
            src/operator_api/acceptance_validated_runtime.py \
            src/operator_api/acceptance_revision_runtime.py \
            .github/workflows/p100-acceptance-pilot.yml
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p100-acceptance-pilot-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            p100-migrations.log
            p100-tests.log
