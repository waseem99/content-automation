name: P85 Brand Profiles

on:
  pull_request:
    branches: [test]
    paths:
      - ".github/workflows/p85-brand-profiles.yml"
      - "migrations/0030_brand_profiles_and_narration_presets.sql"
      - "migrations/README.md"
      - "src/application/brand_profile_service.py"
      - "src/operator_api/brand_profiles_runtime.py"
      - "src/operator_api/runtime_factory.py"
      - "web/static-creator-ui/assets/portfolio-api.js"
      - "web/static-creator-ui/assets/brand-profile-admin.js"
      - "tests/unit/test_p85_brand_profiles.py"
      - "tests/integration/test_p85_brand_profile_lifecycle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      FOOTBALL_BRIEF_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.111" \
            "httpx>=0.27" \
            "pydantic>=2.7" \
            "pydantic-settings>=2.3" \
            "pytest>=8" \
            "psycopg[binary]>=3.2,<4" \
            "psycopg-pool>=3.2,<4" \
            "typer>=0.12"

      - name: Compile service, API, and tests
        run: |
          python -m compileall -q \
            src/application/brand_profile_service.py \
            src/operator_api/brand_profiles_runtime.py \
            src/operator_api/runtime_factory.py \
            tests/unit/test_p85_brand_profiles.py \
            tests/integration/test_p85_brand_profile_lifecycle.py
          node --check web/static-creator-ui/assets/portfolio-api.js
          node --check web/static-creator-ui/assets/brand-profile-admin.js

      - name: Apply all migrations
        run: |
          python -m src.infrastructure.database.cli migrate
          python -m src.infrastructure.database.cli status

      - name: Run P85 contracts and lifecycle tests
        run: |
          pytest -q \
            tests/unit/test_p85_brand_profiles.py \
            tests/integration/test_p85_brand_profile_lifecycle.py
