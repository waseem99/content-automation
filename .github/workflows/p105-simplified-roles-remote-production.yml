name: P105 Simplified Roles and Remote Production

on:
  pull_request:
    branches: [test]
    paths:
      - "src/operator_api/access.py"
      - "src/operations/local_onboarding_v2.py"
      - "migrations/0092_simplified_operator_roles.sql"
      - "scripts/windows/start_local_production.ps1"
      - "scripts/windows/deploy_remote_content_automation.ps1"
      - "scripts/windows/setup_higgsfield_official.ps1"
      - "scripts/windows/check_production_readiness.ps1"
      - "web/static-creator-ui/assets/role-aware-api.js"
      - "docs/operations/PRODUCTION_ACTIVATION.md"
      - "tests/unit/test_p105_simplified_roles_remote_production.py"
      - ".github/workflows/p105-simplified-roles-remote-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p105-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: node --check web/static-creator-ui/assets/role-aware-api.js
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/windows/start_local_production.ps1",
            "scripts/windows/deploy_remote_content_automation.ps1",
            "scripts/windows/setup_higgsfield_official.ps1",
            "scripts/windows/check_production_readiness.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              throw "PowerShell syntax validation failed for $file"
            }
          }
      - name: Apply complete migration chain
        run: python -m src.infrastructure.database.cli migrate
      - name: Focused contracts
        run: python -m pytest -q tests/unit/test_p105_simplified_roles_remote_production.py
      - name: Existing access regressions
        run: python -m pytest -q tests/unit/test_p84_operator_access.py
      - name: Safety boundary
        shell: bash
        run: |
          ! grep -R -n -E "OPERATOR_API_KEYS_JSON=.*(token|secret)|ngrok.*authtoken.*=" \
            scripts/windows docs/operations/PRODUCTION_ACTIVATION.md
          ! grep -R -n -E "browser automation|copied cookies|private endpoint" \
            scripts/windows/setup_higgsfield_official.ps1
