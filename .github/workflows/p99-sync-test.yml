name: P99 Sync Test Base

on:
  push:
    branches: [p99-production-operations]

permissions:
  contents: write

jobs:
  sync-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p99-production-operations
          fetch-depth: 0
      - name: Merge validated test and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin test
          git merge --no-ff origin/test -m "P99 sync validated test base"
          git rm .github/workflows/p99-sync-test.yml
          git commit --amend --no-edit
          git push origin HEAD:p99-production-operations
