name: Platform browser regression

on:
  pull_request:
    paths:
      - "tests/e2e/**"
      - "tests/test_p135_platform_acceptance_contracts.py"
      - "tests/unit/test_p135_full_no_cost_browser_fixes.py"
      - "playwright.config.js"
      - "package.json"
      - "scripts/sanitize_platform_evidence.py"
      - "scripts/windows/*platform*acceptance*.ps1"
      - "scripts/windows/run_platform_smoke.ps1"
      - "scripts/windows/sync_p131_environment.ps1"
      - "scripts/windows/setup_provider_first_rendering.ps1"
      - "scripts/windows/deploy_remote_content_automation.ps1"
      - "src/application/renderers/validated_service.py"
      - "src/operations/fal_fixed_request_pricing.py"
      - "web/static-creator-ui/**"
      - "docs/operations/PROVIDER_FIRST_VIDEO_PRODUCTION.md"
      - ".github/workflows/platform-browser-regression.yml"
  workflow_dispatch:
    inputs:
      run_full_self_hosted:
        description: "Run the full no-cost suite on the controlled Windows workstation"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npx playwright install chromium
      - name: Parse browser acceptance sources
        run: |
          node --check playwright.config.js
          find tests/e2e -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m py_compile \
            scripts/sanitize_platform_evidence.py \
            src/operations/fal_fixed_request_pricing.py \
            src/application/renderers/validated_service.py \
            tests/test_p135_platform_acceptance_contracts.py \
            tests/unit/test_p135_full_no_cost_browser_fixes.py
          pwsh -NoProfile -Command '$files = @("scripts/windows/run_platform_acceptance.ps1", "scripts/windows/setup_provider_first_rendering.ps1", "scripts/windows/deploy_remote_content_automation.ps1"); foreach ($file in $files) { [scriptblock]::Create((Get-Content -LiteralPath $file -Raw)) | Out-Null }'
      - name: Discover all tests
        run: npx playwright test --list
      - name: Run repository acceptance contracts
        run: |
          python -m pip install "pytest>=8,<9"
          python -m pytest -q \
            tests/test_p135_platform_acceptance_contracts.py \
            tests/unit/test_p135_full_no_cost_browser_fixes.py

  controlled-workstation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_self_hosted
    runs-on: [self-hosted, Windows, content-automation-workstation]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Run full no-cost workstation acceptance
        shell: powershell
        run: |
          & .\scripts\windows\run_platform_acceptance.ps1 `
            -BaseUrl "http://127.0.0.1:8000" `
            -Mutating `
            -CrossBrowser
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-acceptance-${{ github.run_id }}
          path: .runtime/e2e/latest/
          if-no-files-found: error
          retention-days: 30
