name: P121 Campaign Operations Grid

on:
  pull_request:
    branches: [test, agent/p120-pre-generation-autopilot]
    paths:
      - "src/application/pre_generation/query_service.py"
      - "src/operator_api/p121_campaign_grid_runtime.py"
      - "src/operator_api/runtime_factory.py"
      - "web/static-creator-ui/assets/studio-v2-campaign-operations.js"
      - "web/static-creator-ui/index.html"
      - "scripts/ci/p121_grid_lifecycle.py"
      - "tests/unit/test_p121_campaign_grid_contracts.py"
      - ".github/workflows/p121-campaign-operations-grid.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p121-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: content_automation
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/content_automation
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      LOCAL_SUPER_ADMIN_OPERATOR_ID: local-super-admin
      LOCAL_ADMIN_OPERATOR_ID: local-admin
      LOCAL_REVIEWER_OPERATOR_ID: local-reviewer
      LOCAL_PLAN_MONTH: 2026-08-01
      KOKORO_PRIMARY_VOICE: af_heart
      KOKORO_ENERGETIC_VOICE: af_bella
      KOKORO_SERIOUS_VOICE: am_adam
      OPS_ENVIRONMENT: staging
      OPS_MIGRATION_HEAD: 0101_p120_pre_generation_autopilot.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests scripts/ci
      - name: Validate campaign grid JavaScript
        run: node --check web/static-creator-ui/assets/studio-v2-campaign-operations.js
      - name: Apply complete migration chain
        run: python -m src.infrastructure.database.cli migrate
      - name: Run canonical onboarding twice
        run: |
          python -m src.operations.local_onboarding_v2
          python -m src.operations.local_onboarding_v2
      - name: Exercise 1200-item cursor grid and matching retry
        run: PYTHONPATH=. python scripts/ci/p121_grid_lifecycle.py
      - name: Focused contracts
        run: python -m pytest -q tests/unit/test_p121_campaign_grid_contracts.py
      - name: Product boundaries
        shell: bash
        run: |
          grep -q "campaign_cursor_sort_mismatch" src/application/pre_generation/query_service.py
          grep -q "FOR UPDATE OF item,run SKIP LOCKED" src/application/pre_generation/query_service.py
          grep -q "Retry all matching" web/static-creator-ui/assets/studio-v2-campaign-operations.js
          ! grep -R -n -E "google_sheets|xlsx|OFFSET" \
            src/application/pre_generation/query_service.py \
            src/operator_api/p121_campaign_grid_runtime.py \
            web/static-creator-ui/assets/studio-v2-campaign-operations.js
