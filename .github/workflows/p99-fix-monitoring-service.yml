name: P99 Fix Monitoring Service

on:
  push:
    branches: [p99-production-operations]

permissions:
  contents: write

jobs:
  fix-monitoring-service:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p99-production-operations
          fetch-depth: 0
      - name: Correct attempt table and immutable alert reuse
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/operations/service.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'FROM football_brief.generation_attempts\n',
              'FROM football_brief.generation_job_attempts\n',
          )
          old = '''                row = conn.execute(
                    """INSERT INTO football_brief.operations_alert_events
                       (environment,alert_key,alert_kind,severity,source,details,details_digest)
                       VALUES (%s,%s,%s,%s,%s,%s::jsonb,%s)
                       ON CONFLICT (environment,alert_key,details_digest)
                       DO UPDATE SET alert_key=EXCLUDED.alert_key
                       RETURNING *""",
                    (
                        environment.value,
                        alert_key,
                        kind.value,
                        severity.value,
                        source,
                        _json(details),
                        details_digest,
                    ),
                ).fetchone()
                alerts.append(dict(row))
'''
          new = '''                row = conn.execute(
                    """INSERT INTO football_brief.operations_alert_events
                       (environment,alert_key,alert_kind,severity,source,details,details_digest)
                       VALUES (%s,%s,%s,%s,%s,%s::jsonb,%s)
                       ON CONFLICT (environment,alert_key,details_digest)
                       DO NOTHING
                       RETURNING *""",
                    (
                        environment.value,
                        alert_key,
                        kind.value,
                        severity.value,
                        source,
                        _json(details),
                        details_digest,
                    ),
                ).fetchone()
                if row is None:
                    row = conn.execute(
                        """SELECT * FROM football_brief.operations_alert_events
                           WHERE environment=%s AND alert_key=%s AND details_digest=%s""",
                        (environment.value, alert_key, details_digest),
                    ).fetchone()
                alerts.append(dict(row))
'''
          if source.count(old) != 1:
              raise SystemExit('Expected one alert upsert block')
          source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY
          rm .github/workflows/p99-fix-monitoring-service.yml
      - name: Commit monitoring corrections and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/operations/service.py .github/workflows/p99-fix-monitoring-service.yml
          git commit -m "P99 correct monitoring schema and immutable alert reuse"
          git push origin HEAD:p99-production-operations
