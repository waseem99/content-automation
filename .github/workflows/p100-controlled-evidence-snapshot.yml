name: P100 Controlled Evidence Snapshot

on:
  push:
    branches: [p100-controlled-evidence-snapshot]
  pull_request:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: p100-controlled-evidence-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controlled-evidence-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_snapshot
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_snapshot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_snapshot
      FOOTBALL_BRIEF_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_snapshot
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115" "httpx>=0.27" "pydantic>=2.7" "pydantic-settings>=2.3" "pytest>=8" "psycopg[binary]>=3.2,<4" "psycopg-pool>=3.2,<4" "typer>=0.12"
      - name: Compile snapshot service API and tests
        run: |
          python -m compileall -q \
            src/application/acceptance \
            src/operator_api/acceptance_controlled_snapshot_runtime.py \
            src/operator_api/acceptance_controlled_start_runtime.py \
            src/operator_api/runtime_factory.py \
            tests/unit/test_p100_controlled_snapshot_studio_contracts.py \
            tests/integration/test_p100_controlled_evidence_snapshot.py \
            tests/integration/test_p100_controlled_pilot_start.py \
            tests/integration/test_p100_controlled_draft_bootstrap.py \
            tests/integration/test_p100_pilot_candidate_discovery.py \
            tests/integration/test_p100_execution_readiness.py \
            tests/integration/test_p100_acceptance_configured_app.py \
            tests/integration/test_p100_acceptance_foundation.py
          node --check web/static-creator-ui/assets/studio-v2-p100-snapshot.js
      - name: Verify current environment schema identity
        run: |
          grep -q '^OPS_MIGRATION_HEAD=0090_acceptance_start_actor.sql$' config/staging.env.example
          grep -q '^OPS_MIGRATION_HEAD=0090_acceptance_start_actor.sql$' config/production.env.example
      - name: Apply and verify complete migration chain
        run: |
          set -o pipefail
          { python -m src.infrastructure.database.cli migrate; python -m src.infrastructure.database.cli status; python -m src.infrastructure.database.cli health --json; } 2>&1 | tee p100-snapshot-migrations.log
      - name: Run controlled snapshot and P100 regressions
        run: |
          set -o pipefail
          pytest -vv \
            tests/unit/test_p100_controlled_snapshot_studio_contracts.py \
            tests/integration/test_p100_controlled_evidence_snapshot.py \
            tests/integration/test_p100_controlled_pilot_start.py \
            tests/integration/test_p100_controlled_draft_bootstrap.py \
            tests/integration/test_p100_pilot_candidate_discovery.py \
            tests/integration/test_p100_execution_readiness.py \
            tests/integration/test_p100_acceptance_configured_app.py \
            tests/integration/test_p100_acceptance_foundation.py \
            2>&1 | tee p100-snapshot-tests.log
      - name: Prove snapshot has no production or deployment side effects
        run: |
          ! grep -R -n -E "provider\.submi[t]|\.enqueu[e]|reserve_spen[d]|execute_live_deliver[y]|submit_live_deliver[y]|platform_delivery_requests.*INSER[T]|generation_jobs.*INSER[T]|production_spend_reservations.*INSER[T]|final_releases.*INSER[T]|acceptance_pilot_signoffs.*INSER[T]|acceptance_live_delivery_evidence.*INSER[T]|operations_drill_runs.*INSER[T]|operations_restore_events.*INSER[T]|vercel depl[o]y|vercel --pr[o]d|docker pus[h]|kubectl appl[y]|gh release creat[e]" \
            src/application/acceptance/controlled_snapshot_models.py \
            src/application/acceptance/controlled_snapshot_service.py \
            src/operator_api/acceptance_controlled_snapshot_runtime.py \
            web/static-creator-ui/assets/studio-v2-p100-snapshot.js \
            tests/integration/test_p100_controlled_evidence_snapshot.py \
            .github/workflows/p100-controlled-evidence-snapshot.yml
          grep -q "snapshot_kind.*controlled_batch" src/application/acceptance/controlled_snapshot_service.py
          ! grep -n -E "SET status='running'|SET status=\"running\"" src/application/acceptance/controlled_snapshot_service.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p100-controlled-evidence-snapshot-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            p100-snapshot-migrations.log
            p100-snapshot-tests.log
