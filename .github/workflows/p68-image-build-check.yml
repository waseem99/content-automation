name: P68 Image Build Check
on:
  push:
    branches: [fix-p68-pin-comfyui-v0326]
  pull_request:
    branches: [test]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build image and capture diagnostics
        id: image_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker build --progress=plain \
            --build-arg COMFYUI_REF=v0.3.26 \
            -t p68-preview-check \
            deploy/p68-local-keyframe-worker > p68-image-build.log 2>&1
          status=$?
          echo "$status" > p68-image-build.status
          exit $status

      - name: Smoke-test ComfyUI startup and health API
        if: steps.image_build.outcome == 'success'
        shell: bash
        run: |
          set -e
          docker run -d --name p68-preview-smoke \
            -p 127.0.0.1:8188:8188 \
            --entrypoint python \
            p68-preview-check \
            main.py --cpu --listen 0.0.0.0 --port 8188
          cleanup() {
            docker logs p68-preview-smoke > p68-startup.log 2>&1 || true
            docker rm -f p68-preview-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8188/system_stats > p68-system-stats.json; then
              ready=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' p68-preview-smoke 2>/dev/null | grep -q true; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs p68-preview-smoke
            exit 1
          fi
          test -s p68-system-stats.json

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p68-image-build-diagnostics
          path: |
            p68-image-build.log
            p68-image-build.status
            p68-startup.log
            p68-system-stats.json
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce build result
        if: always()
        shell: bash
        run: |
          status=$(cat p68-image-build.status)
          tail -n 40 p68-image-build.log
          exit "$status"
