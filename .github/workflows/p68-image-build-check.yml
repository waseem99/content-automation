name: P68 Image Build Check
on:
  push:
    branches: [fix-p68-use-verified-pytorch-image]
  pull_request:
    branches: [test]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image and print concise diagnostics
        shell: bash
        run: |
          set +e
          docker build --progress=plain \
            --build-arg COMFYUI_REF=1d1099bea08efa6904480cf25c54ea92646aea4f \
            -t p68-preview-check \
            deploy/p68-local-keyframe-worker > /tmp/p68-build.log 2>&1
          status=$?
          tail -n 220 /tmp/p68-build.log
          exit $status
