name: P99 Production Operations

on:
  pull_request:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: p99-production-operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  operations-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      FOOTBALL_BRIEF_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115" "httpx>=0.27" "pydantic>=2.7" "pydantic-settings>=2.3" "pytest>=8" "psycopg[binary]>=3.2,<4" "psycopg-pool>=3.2,<4" "typer>=0.12"
      - name: Compile operations modules and tests
        run: |
          python -m compileall -q \
            src/operations \
            src/operator_api/operations_middleware.py \
            src/operator_api/operations_runtime.py \
            src/operator_api/operations_validated_runtime.py \
            src/operator_api/generation_jobs_runtime.py \
            src/operator_api/runtime_factory.py \
            tests/unit/test_p99_operations_contracts.py \
            tests/integration/test_p99_operations_lifecycle.py \
            tests/integration/test_p99_operations_api.py
      - name: Apply and verify complete migration chain
        run: |
          set -o pipefail
          { python -m src.infrastructure.database.cli migrate; python -m src.infrastructure.database.cli status; python -m src.infrastructure.database.cli health --json; } 2>&1 | tee p99-migrations.log
      - name: Run operations and worker-resume tests
        run: |
          set -o pipefail
          pytest -vv \
            tests/unit/test_p99_operations_contracts.py \
            tests/integration/test_p99_operations_lifecycle.py \
            tests/integration/test_p99_operations_api.py \
            tests/integration/test_p87_generation_jobs.py \
            2>&1 | tee p99-tests.log
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p99-operations-lifecycle-logs
          retention-days: 14
          if-no-files-found: ignore
          path: |
            p99-migrations.log
            p99-tests.log

  backup-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_restore
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_restore
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL client and focused dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.7" "pydantic-settings>=2.3" "psycopg[binary]>=3.2,<4" "psycopg-pool>=3.2,<4" "typer>=0.12"
      - name: Apply migrations and create representative evidence
        run: |
          python -m src.infrastructure.database.cli migrate
          mkdir -p /tmp/p99/artifacts/nested /tmp/p99/restored /tmp/p99/backups
          printf 'P99 artifact restore evidence\n' > /tmp/p99/artifacts/nested/review-proxy.txt
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) AS migration_count FROM football_brief.schema_migrations;" | tee /tmp/p99/pre-restore-count.txt
      - name: Create and restore database backup
        run: |
          python -m src.operations.cli database-backup \
            --destination /tmp/p99/backups/football_brief.dump \
            --environment staging | tee /tmp/p99/database-backup.json
          DB_SHA="$(sha256sum /tmp/p99/backups/football_brief.dump | awk '{print $1}')"
          python -m src.operations.cli database-restore-drill \
            --backup /tmp/p99/backups/football_brief.dump \
            --expected-sha256 "$DB_SHA" \
            --expected-migration-head 0082_production_operations_integrity.sql \
            --environment staging \
            --allow-destructive-drill | tee /tmp/p99/database-restore.json
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT filename FROM football_brief.schema_migrations WHERE filename='0082_production_operations_integrity.sql';"
      - name: Create and restore media artifact backup
        run: |
          python -m src.operations.cli artifact-backup \
            --root /tmp/p99/artifacts \
            --destination /tmp/p99/backups/artifacts.zip \
            --environment staging | tee /tmp/p99/artifact-backup.json
          ARTIFACT_SHA="$(sha256sum /tmp/p99/backups/artifacts.zip | awk '{print $1}')"
          rm -rf /tmp/p99/restored
          python -m src.operations.cli artifact-restore-drill \
            --backup /tmp/p99/backups/artifacts.zip \
            --destination /tmp/p99/restored \
            --expected-sha256 "$ARTIFACT_SHA" \
            --environment staging \
            --allow-destructive-drill | tee /tmp/p99/artifact-restore.json
          cmp /tmp/p99/artifacts/nested/review-proxy.txt /tmp/p99/restored/nested/review-proxy.txt
      - name: Upload restore drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p99-backup-restore-drill
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/p99/database-backup.json
            /tmp/p99/database-restore.json
            /tmp/p99/artifact-backup.json
            /tmp/p99/artifact-restore.json
            /tmp/p99/pre-restore-count.txt

  staging-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate reproducible staging configuration
        run: |
          docker compose --env-file config/staging.env.example -f compose.staging.yml config > /tmp/p99-compose-rendered.yml
          grep -q "read_only: true" /tmp/p99-compose-rendered.yml
          grep -q "service_completed_successfully" /tmp/p99-compose-rendered.yml
      - name: Repository and dependency security scans
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit>=1.7.9" "pip-audit>=2.7.3"
          bandit -q -r src -ll -iii -s B603,B607
          pip-audit -r requirements.txt --progress-spinner off
      - name: Recreate and smoke-test disposable staging
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --env-file config/staging.env.example -f compose.staging.yml logs --no-color > /tmp/p99-staging.log 2>&1 || true
            docker compose --env-file config/staging.env.example -f compose.staging.yml down -v --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose --env-file config/staging.env.example -f compose.staging.yml up -d --build
          ready=0
          for _ in $(seq 1 36); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/runtime/ready > /tmp/p99-readiness.json; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --env-file config/staging.env.example -f compose.staging.yml ps
            exit 1
          fi
          grep -q '"ok":true' /tmp/p99-readiness.json
          docker image inspect content-automation:p99-local > /tmp/p99-image-inspect.json
      - name: Scan local container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: content-automation:p99-local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
      - name: Prove no deployment workflow is introduced
        run: |
          ! grep -R -n -E "vercel deploy|vercel --prod|kubectl apply|docker push|gh release create" \
            .github/workflows/p99-production-operations.yml \
            compose.staging.yml \
            docs/operations/P99_RUNBOOKS.md
      - name: Upload staging and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p99-staging-security-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/p99-compose-rendered.yml
            /tmp/p99-readiness.json
            /tmp/p99-image-inspect.json
            /tmp/p99-staging.log
