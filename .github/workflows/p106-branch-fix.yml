name: P106 Branch Compatibility Fix

on:
  push:
    branches:
      - agent/p106-youtube-official-publishing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p106-youtube-official-publishing
          fetch-depth: 0
      - name: Apply focused compatibility fixes
        shell: python
        run: |
          from pathlib import Path

          service = Path("src/application/delivery/official_service.py")
          service_text = service.read_text(encoding="utf-8")
          old_init = '''    def __init__(self, database: Any) -> None:\n        super().__init__(database, adapters=default_delivery_adapters(database))\n'''
          new_init = '''    def __init__(self, database: Any, *, adapters: Mapping[str, Any] | None = None) -> None:\n        super().__init__(\n            database,\n            adapters=adapters if adapters is not None else default_delivery_adapters(database),\n        )\n'''
          if old_init not in service_text:
              raise SystemExit("Expected OfficialPlatformDeliveryService constructor not found")
          service.write_text(service_text.replace(old_init, new_init, 1), encoding="utf-8")

          youtube = Path("src/application/delivery/youtube.py")
          youtube_text = youtube.read_text(encoding="utf-8")
          old_open = "            return urlopen(request, timeout=self.timeout_seconds)\n"
          new_open = (
              "            # Requests are limited to the hard-coded Google HTTPS endpoints or the "
              "HTTPS resumable session returned by YouTube.\n"
              "            return urlopen(request, timeout=self.timeout_seconds)  # nosec B310\n"
          )
          if old_open not in youtube_text:
              raise SystemExit("Expected YouTube urlopen call not found")
          youtube.write_text(youtube_text.replace(old_open, new_open, 1), encoding="utf-8")
      - name: Commit focused fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/delivery/official_service.py src/application/delivery/youtube.py
          git commit -m "Fix P106 compatibility and URL audit"
          git push origin HEAD:agent/p106-youtube-official-publishing
