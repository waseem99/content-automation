name: P67 Facebook Reference Samples

on:
  pull_request:
    branches:
      - test
    paths:
      - "reference-engine/**"
      - "video-engine/**"
      - ".github/workflows/p67-facebook-samples.yml"
      - "tests/integration/test_p67_reference_samples.py"
  push:
    branches:
      - test
    paths:
      - "reference-engine/**"
      - "video-engine/**"
      - ".github/workflows/p67-facebook-samples.yml"
      - "tests/integration/test_p67_reference_samples.py"

permissions:
  contents: read

jobs:
  live-reference-and-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOICE_PROVIDER: kokoro
      KOKORO_VOICE: af_heart
      KOKORO_SPEED: "1.08"
      REMOTION_CONCURRENCY: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            reference-engine/pyproject.toml
            video-engine/voice-requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video-engine/package-lock.json

      - name: Install system media and speech dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version | head -n 1

      - name: Install reference engine and current yt-dlp
        run: |
          python -m pip install -e './reference-engine[media,dev]'
          python -m pip install -U --pre 'yt-dlp[default]'

      - name: Run real Facebook public-reference probe
        continue-on-error: false
        run: |
          mkdir -p p67-artifacts/reference
          python reference-engine/scripts/p67_live_facebook_probe.py \
            --manifest reference-engine/pilots/p67-facebook-sources.json \
            --output p67-artifacts/reference \
            --page-limit 5

      - name: Show live probe summary
        run: python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('p67-artifacts/reference/p67-live-results.json').read_text())
          print(json.dumps(payload['summary'], indent=2))
          for item in payload['results']:
              print(item['id'], item['status'], item.get('error', '')[:240])
          PY

      - name: Install video engine and Kokoro
        working-directory: video-engine
        run: |
          npm ci
          python -m pip install -r voice-requirements.txt

      - name: Validate TypeScript and projects
        working-directory: video-engine
        run: |
          npx tsc --noEmit
          npm run validate:p67

      - name: Generate local Kokoro narration
        working-directory: video-engine
        run: |
          node scripts/generate-voice.mjs samples/rawr-nation-blind-spot.json
          node scripts/generate-voice.mjs samples/animal-x-elephant-ground-signals.json
          test -s out/rawr-nation-hidden-blind-spot-p67-kokoro-voiced.json
          test -s out/animal-x-elephant-ground-signals-p67-kokoro-voiced.json
          test -s public/generated/rawr-nation-hidden-blind-spot-p67-kokoro.wav
          test -s public/generated/animal-x-elephant-ground-signals-p67-kokoro.wav

      - name: Render original narrated samples
        working-directory: video-engine
        run: |
          node scripts/render.mjs \
            out/rawr-nation-hidden-blind-spot-p67-kokoro-voiced.json \
            out/rawr-nation-hidden-blind-spot-p67.mp4
          node scripts/render.mjs \
            out/animal-x-elephant-ground-signals-p67-kokoro-voiced.json \
            out/animal-x-elephant-ground-signals-p67.mp4

      - name: Probe rendered MP4s
        working-directory: video-engine
        run: |
          for video in \
            out/rawr-nation-hidden-blind-spot-p67.mp4 \
            out/animal-x-elephant-ground-signals-p67.mp4; do
            test -s "$video"
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -show_entries format=duration \
              -of json "$video"
          done

      - name: Stage original sample artifacts
        run: |
          mkdir -p p67-artifacts/samples
          cp video-engine/out/rawr-nation-hidden-blind-spot-p67.mp4 p67-artifacts/samples/
          cp video-engine/out/rawr-nation-hidden-blind-spot-p67.render.json p67-artifacts/samples/
          cp video-engine/out/rawr-nation-hidden-blind-spot-p67-kokoro-voiced.json p67-artifacts/samples/
          cp video-engine/out/rawr-nation-hidden-blind-spot-p67-kokoro-alignment.json p67-artifacts/samples/
          cp video-engine/out/animal-x-elephant-ground-signals-p67.mp4 p67-artifacts/samples/
          cp video-engine/out/animal-x-elephant-ground-signals-p67.render.json p67-artifacts/samples/
          cp video-engine/out/animal-x-elephant-ground-signals-p67-kokoro-voiced.json p67-artifacts/samples/
          cp video-engine/out/animal-x-elephant-ground-signals-p67-kokoro-alignment.json p67-artifacts/samples/

      - name: Confirm no source video enters artifacts
        run: |
          if find p67-artifacts/reference -type f \( -name '*.mp4' -o -name '*.mov' -o -name '*.mkv' -o -name '*.webm' \) | grep -q .; then
            echo 'Downloaded source media must not be uploaded as an artifact.' >&2
            exit 1
          fi

      - name: Upload Facebook analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p67-facebook-reference-analysis
          path: p67-artifacts/reference
          if-no-files-found: error
          retention-days: 7

      - name: Upload original narrated samples
        uses: actions/upload-artifact@v4
        with:
          name: p67-original-narrated-samples
          path: p67-artifacts/samples
          if-no-files-found: error
          retention-days: 7
