name: P1 PostgreSQL Foundation

on:
  pull_request:
    branches:
      - phase-0-1-foundation
      - test
    paths:
      - "migrations/**"
      - "src/domain/**"
      - "src/infrastructure/database/**"
      - "tests/unit/test_database_settings.py"
      - "tests/unit/test_migration_runner.py"
      - "tests/integration/test_database_foundation.py"
      - "tests/acceptance/test_migration_contracts.py"
      - "requirements.txt"
      - ".github/workflows/p1-postgres-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_brief_test
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      FOOTBALL_BRIEF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_brief_test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic>=2.7.0" \
            "pydantic-settings>=2.3.0" \
            "typer>=0.12.0" \
            "pytest>=8.0.0" \
            "psycopg[binary]>=3.2.0,<4.0" \
            "psycopg-pool>=3.2.0,<4.0"

      - name: Compile foundation modules
        run: python -m compileall -q src/domain src/infrastructure/database tests

      - name: Run database unit tests
        id: unit_tests
        run: |
          set -o pipefail
          pytest -vv \
            tests/unit/test_database_settings.py \
            tests/unit/test_migration_runner.py 2>&1 | tee unit-tests.log

      - name: Run static migration-contract tests
        id: migration_contracts
        run: |
          set -o pipefail
          pytest -vv tests/acceptance/test_migration_contracts.py 2>&1 | tee migration-contracts.log

      - name: Apply migrations through application runner
        id: migrate
        run: |
          set -o pipefail
          python -m src.infrastructure.database.cli migrate 2>&1 | tee migrate.log

      - name: Verify migration status and health
        id: database_health
        run: |
          set -o pipefail
          {
            python -m src.infrastructure.database.cli status
            python -m src.infrastructure.database.cli health --json
          } 2>&1 | tee database-health.log

      - name: Run live PostgreSQL integration tests
        id: integration_tests
        run: |
          set -o pipefail
          pytest -vv -m integration tests/integration/test_database_foundation.py 2>&1 | tee integration-tests.log

      - name: Upload foundation test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-postgres-foundation-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            unit-tests.log
            migration-contracts.log
            migrate.log
            database-health.log
            integration-tests.log
