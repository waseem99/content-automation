name: P0 Rights Gate

on:
  pull_request:
    branches:
      - test
    paths:
      - "migrations/**"
      - "policies/rights-gate/**"
      - "src/application/rights/**"
      - "src/commands/rights.py"
      - "src/infrastructure/database/**"
      - "tests/unit/rights/**"
      - "tests/integration/rights_support.py"
      - "tests/integration/test_rights_*.py"
      - "tests/acceptance/test_rights_gate_migration_contracts.py"
      - ".github/workflows/p0-rights-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_brief_test
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      FOOTBALL_BRIEF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_brief_test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic>=2.7.0" \
            "pydantic-settings>=2.3.0" \
            "typer>=0.12.0" \
            "pytest>=8.0.0" \
            "psycopg[binary]>=3.2.0,<4.0" \
            "psycopg-pool>=3.2.0,<4.0"

      - name: Compile rights modules
        run: |
          python -m compileall -q \
            src/application/rights \
            src/commands/rights.py \
            src/infrastructure/database \
            tests/unit/rights \
            tests/integration

      - name: Run rights unit tests
        run: |
          set -o pipefail
          pytest -vv tests/unit/rights 2>&1 | tee rights-unit-tests.log

      - name: Run migration contracts
        run: |
          set -o pipefail
          pytest -vv \
            tests/acceptance/test_migration_contracts.py \
            tests/acceptance/test_rights_gate_migration_contracts.py \
            2>&1 | tee rights-migration-contracts.log

      - name: Apply and verify all migrations
        run: |
          set -o pipefail
          {
            python -m src.infrastructure.database.cli migrate
            python -m src.infrastructure.database.cli status
            python -m src.infrastructure.database.cli health --json
          } 2>&1 | tee rights-migration-runtime.log

      - name: Run live rights integration tests
        run: |
          set -o pipefail
          pytest -vv -m integration \
            tests/integration/test_rights_approval.py \
            tests/integration/test_rights_gate.py \
            tests/integration/test_rights_gate_revalidation.py \
            2>&1 | tee rights-integration-tests.log

      - name: Run existing database and registry regressions
        run: |
          set -o pipefail
          pytest -q -m integration \
            tests/integration/test_database_foundation.py \
            tests/integration/test_asset_registry.py \
            tests/integration/test_asset_pipeline.py \
            tests/integration/test_evidence_and_voice_registry.py \
            2>&1 | tee rights-regression-tests.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-rights-gate-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            rights-unit-tests.log
            rights-migration-contracts.log
            rights-migration-runtime.log
            rights-integration-tests.log
            rights-regression-tests.log
