name: P0 Quality Gate

on:
  pull_request:
    branches:
      - test
    paths:
      - "migrations/**"
      - "src/application/quality/**"
      - "src/domain/quality_models.py"
      - "src/infrastructure/database/repository_quality.py"
      - "src/infrastructure/database/repository_release_refs.py"
      - "tests/integration/quality_support.py"
      - "tests/integration/test_quality_package_guard.py"
      - "tests/integration/test_quality_media_and_disclosure.py"
      - "tests/acceptance/test_quality_gate_contracts.py"
      - "docs/implementation/quality-gate-coverage.md"
      - ".github/workflows/p0-quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      FOOTBALL_BRIEF_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic>=2.7.0" \
            "pydantic-settings>=2.3.0" \
            "typer>=0.12.0" \
            "pytest>=8.0.0" \
            "psycopg[binary]>=3.2.0,<4.0" \
            "psycopg-pool>=3.2.0,<4.0" \
            "moviepy>=2.0.0" \
            "Pillow>=10.0.0" \
            "numpy>=1.26.0"

      - name: Compile quality modules
        run: |
          python -m compileall -q \
            src/application/quality \
            src/domain \
            src/infrastructure/database \
            tests/integration/quality_support.py \
            tests/integration/test_quality_package_guard.py \
            tests/integration/test_quality_media_and_disclosure.py

      - name: Run migration contracts
        run: |
          set -o pipefail
          pytest -vv \
            tests/acceptance/test_migration_contracts.py \
            tests/acceptance/test_quality_gate_contracts.py \
            2>&1 | tee quality-gate-contracts.log

      - name: Apply and verify all migrations
        run: |
          set -o pipefail
          {
            python -m src.infrastructure.database.cli migrate
            python -m src.infrastructure.database.cli status
            python -m src.infrastructure.database.cli health --json
          } 2>&1 | tee quality-gate-migrations.log

      - name: Run quality gate integration tests
        run: |
          set -o pipefail
          pytest -vv -m integration \
            tests/integration/test_quality_package_guard.py \
            tests/integration/test_quality_media_and_disclosure.py \
            2>&1 | tee quality-gate-integration-tests.log

      - name: Run related compliance regressions
        run: |
          set -o pipefail
          pytest -q -m integration \
            tests/integration/test_asset_registry.py \
            tests/integration/test_rights_gate.py \
            tests/integration/test_manifest_builder.py \
            tests/integration/manifest_runtime_cases.py \
            tests/integration/test_voice_media_policy.py \
            tests/integration/test_provider_lineage.py \
            2>&1 | tee quality-gate-regression-tests.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-quality-gate-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            quality-gate-contracts.log
            quality-gate-migrations.log
            quality-gate-integration-tests.log
            quality-gate-regression-tests.log
