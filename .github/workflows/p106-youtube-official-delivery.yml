name: P106 Official YouTube Delivery

on:
  pull_request:
    branches:
      - test
      - agent/p105-simplified-roles-remote-production
    paths:
      - "migrations/0093_youtube_official_delivery.sql"
      - "src/application/delivery/**"
      - "scripts/setup_youtube_oauth.py"
      - "scripts/windows/setup_youtube_official.ps1"
      - "tests/unit/test_p106_youtube_official_delivery.py"
      - "tests/integration/test_p97_platform_delivery_api.py"
      - "tests/integration/test_p97_platform_delivery_lifecycle.py"
      - ".github/workflows/p106-youtube-official-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p106-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  youtube-official:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/windows/setup_youtube_official.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell syntax validation failed"
          }
      - name: Apply complete migration chain
        run: python -m src.infrastructure.database.cli migrate
      - name: Official YouTube unit contracts
        run: python -m pytest -q tests/unit/test_p106_youtube_official_delivery.py
      - name: Existing simulated delivery regressions
        run: |
          python -m pytest -q \
            tests/unit/test_p97_platform_delivery_contracts.py \
            tests/integration/test_p97_platform_delivery_api.py \
            tests/integration/test_p97_platform_delivery_lifecycle.py
      - name: Secret and live-action safety
        shell: bash
        run: |
          ! grep -R -n -E '(client_secret|refresh_token)=[^" ]+' \
            src/application/delivery scripts/setup_youtube_oauth.py scripts/windows/setup_youtube_official.ps1
          ! grep -R -n 'allow_public = \$true' scripts/windows/setup_youtube_official.ps1
          ! grep -R -n 'notify_subscribers = \$true' scripts/windows/setup_youtube_official.ps1
