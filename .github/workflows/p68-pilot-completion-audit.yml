name: P68 Pilot Completion Audit

on:
  workflow_dispatch:
  push:
    branches:
      - p68-pilot-completion
    paths:
      - ".github/workflows/p68-pilot-completion-audit.yml"
      - "src/p68_completion_audit.py"
      - "src/p68_motion_batch.py"
      - "src/p68_keyframe_batch.py"
      - "src/p68_scientific_animation.py"
      - "scripts/p68_audit_completion.py"
      - "scripts/p68_render_science.py"
      - "tests/unit/test_p68_completion_audit.py"
      - "tests/unit/test_p68_motion_batch.py"
      - "tests/unit/test_p68_keyframe_batch.py"
      - "tests/unit/test_p68_keyframe_generator.py"
      - "tests/unit/test_p68_scientific_animation.py"
      - "p68-pilots/**"
  pull_request:
    branches:
      - test
    paths:
      - ".github/workflows/p68-pilot-completion-audit.yml"
      - "src/p68_completion_audit.py"
      - "src/p68_motion_batch.py"
      - "src/p68_keyframe_batch.py"
      - "src/p68_scientific_animation.py"
      - "scripts/p68_audit_completion.py"
      - "scripts/p68_render_science.py"
      - "tests/unit/test_p68_completion_audit.py"
      - "tests/unit/test_p68_motion_batch.py"
      - "tests/unit/test_p68_keyframe_batch.py"
      - "tests/unit/test_p68_keyframe_generator.py"
      - "tests/unit/test_p68_scientific_animation.py"
      - "p68-pilots/**"

permissions:
  contents: read

jobs:
  audit:
    name: Audit and render deterministic P68 shots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out pilot completion branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pillow pytest

      - name: Run focused P68 completion tests
        run: |
          python -m pytest -q \
            tests/unit/test_p68_completion_audit.py \
            tests/unit/test_p68_motion_batch.py \
            tests/unit/test_p68_keyframe_batch.py \
            tests/unit/test_p68_keyframe_generator.py \
            tests/unit/test_p68_scientific_animation.py

      - name: Write clean-clone completion audit
        run: |
          mkdir -p p68-ci/reports p68-ci/artifacts
          PYTHONPATH=. python scripts/p68_audit_completion.py \
            --artifact-root p68-ci/artifacts \
            --output p68-ci/reports/clean-clone-audit.json

      - name: Render every deterministic authored-science shot
        run: |
          set +e
          status=0
          pilots=$(PYTHONPATH=. python -c "from src.p68_scientific_animation import RENDERERS; print(' '.join(sorted({pilot for pilot, _ in RENDERERS})))")
          for pilot in $pilots; do
            echo "=== Rendering $pilot ==="
            PYTHONPATH=. python scripts/p68_render_science.py \
              --pilot "$pilot" \
              --artifact-root p68-ci/artifacts \
              2>&1 | tee "p68-ci/reports/render-${pilot}.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              echo "FAILED: $pilot (exit $code)" | tee -a "p68-ci/reports/render-${pilot}.log"
              status=$code
            else
              echo "PASSED: $pilot" | tee -a "p68-ci/reports/render-${pilot}.log"
            fi
          done
          exit "$status"

      - name: Verify authored-science completion and rewrite audit
        run: |
          PYTHONPATH=. python scripts/p68_audit_completion.py \
            --artifact-root p68-ci/artifacts \
            --output p68-ci/reports/post-science-audit.json
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("p68-ci/reports/post-science-audit.json").read_text())
          totals = result["totals"]
          assert totals["authored_science_shots"] == 13, totals
          assert totals["authored_science_ready"] == 13, totals
          assert totals["natural_motion_shots"] == 23, totals
          assert totals["keyframes_missing"] == 23, totals
          assert result["next_gate"] == "create_and_review_shot_specific_keyframes", result["next_gate"]
          assert result["provider_calls_made"] == 0
          assert result["paid_provider_calls_made"] == 0
          assert result["publish_allowed"] is False
          PY

      - name: Record audit summary
        if: success()
        run: |
          PYTHONPATH=. python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("p68-ci/reports/post-science-audit.json").read_text())
          totals = result["totals"]
          print("## P68 pilot completion audit")
          print()
          print(f"- Pilots: {result['pilot_count']}")
          print(f"- Total shots: {totals['total_shots']}")
          print(f"- Authored-science shots ready: {totals['authored_science_ready']}/{totals['authored_science_shots']}")
          print(f"- Natural-motion shots: {totals['natural_motion_shots']}")
          print(f"- Shot-specific keyframes still required: {totals['keyframes_missing']}")
          print(f"- Next gate: `{result['next_gate']}`")
          print("- Provider calls: 0")
          print("- Paid rendering: 0")
          print("- Publish allowed: no")
          PY

      - name: Upload private review artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p68-pilot-completion-audit-${{ github.run_attempt }}
          path: p68-ci
          if-no-files-found: error
          retention-days: 7
