name: P106 Clock Compatibility Fix

on:
  push:
    branches:
      - agent/p106-youtube-official-publishing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p106-youtube-official-publishing
          fetch-depth: 0
      - name: Use canonical delivery clock
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/application/delivery/official_service.py")
          text = path.read_text(encoding="utf-8")
          old_import = '''from src.application.delivery.service import (\n    PlatformDeliveryError,\n    PlatformDeliveryService,\n    _utcnow,\n)\n'''
          new_import = '''from src.application.delivery import service as delivery_service\nfrom src.application.delivery.service import (\n    PlatformDeliveryError,\n    PlatformDeliveryService,\n)\n'''
          if old_import not in text:
              raise SystemExit("Expected delivery service import block not found")
          text = text.replace(old_import, new_import, 1)
          if "now = _utcnow()" not in text:
              raise SystemExit("Expected delivery clock call not found")
          text = text.replace("now = _utcnow()", "now = delivery_service._utcnow()", 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit focused fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/delivery/official_service.py
          git commit -m "Use canonical delivery clock in official service"
          git push origin HEAD:agent/p106-youtube-official-publishing
