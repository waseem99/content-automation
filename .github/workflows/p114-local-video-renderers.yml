name: P114 Local Video Renderers

on:
  pull_request:
    branches: [test]
    paths:
      - "migrations/0099_p114_local_video_renderers.sql"
      - "src/application/generation_jobs/models.py"
      - "src/application/local_video/**"
      - "src/operations/local_video_worker.py"
      - "config/local.env.example"
      - "tests/unit/test_p114_local_video_contracts.py"
      - ".github/workflows/p114-local-video-renderers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p114-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: content_automation
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/content_automation
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      LOCAL_SUPER_ADMIN_OPERATOR_ID: local-super-admin
      LOCAL_ADMIN_OPERATOR_ID: local-admin
      LOCAL_REVIEWER_OPERATOR_ID: local-reviewer
      LOCAL_PLAN_MONTH: 2026-08-01
      KOKORO_PRIMARY_VOICE: af_heart
      KOKORO_ENERGETIC_VOICE: af_bella
      KOKORO_SERIOUS_VOICE: am_adam
      OPS_ENVIRONMENT: staging
      OPS_MIGRATION_HEAD: 0099_p114_local_video_renderers.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Apply complete migration chain
        run: python -m src.infrastructure.database.cli migrate
      - name: Run operator and model policy onboarding
        run: |
          python -m src.operations.local_onboarding_v2
          python -m src.operations.p113_model_policy_onboarding
      - name: Verify local clip schema
        run: |
          python - <<'PY'
          from src.infrastructure.database.connection import Database
          from src.infrastructure.database.settings import get_database_settings

          database = Database(get_database_settings())
          database.open(require_schema=True)
          try:
              with database.connection() as conn:
                  constraint = conn.execute(
                      """SELECT pg_get_constraintdef(oid) AS definition
                           FROM pg_constraint
                           WHERE conrelid='football_brief.generation_jobs'::regclass
                             AND conname='generation_jobs_job_type_p114_check'"""
                  ).fetchone()
                  assert constraint and "local_clip" in constraint["definition"]
                  assert conn.execute(
                      "SELECT to_regclass('football_brief.local_video_workflows') AS value"
                  ).fetchone()["value"] is not None
                  assert conn.execute(
                      "SELECT to_regclass('football_brief.local_video_executions') AS value"
                  ).fetchone()["value"] is not None
          finally:
              database.close()
          PY
      - name: Focused P114 contracts
        run: python -m pytest -q tests/unit/test_p114_local_video_contracts.py
      - name: Existing queue, renderer, routing and pilot regressions
        run: >-
          python -m pytest -q
          tests/unit/test_p87_generation_job_contracts.py
          tests/unit/test_p93_renderer_contracts.py
          tests/unit/test_p94_routing_contracts.py
          tests/unit/test_p113_video_pilot_contracts.py
      - name: Safety boundary
        shell: bash
        run: |
          ! grep -R -n -E "automatic paid generation|automatic public publishing|external_cost_usd[^\n]*> 0" \
            src/application/local_video src/operations/local_video_worker.py migrations/0099_p114_local_video_renderers.sql
          grep -q "P114_LOCAL_VIDEO_ENABLED=false" config/local.env.example
