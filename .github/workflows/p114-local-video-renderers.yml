name: P114 Local Video Renderers

on:
  pull_request:
    branches: [test]
    paths:
      - "migrations/0099_p114_local_video_renderers.sql"
      - "src/application/generation_jobs/models.py"
      - "src/application/local_video/**"
      - "src/operations/local_video_worker.py"
      - "src/operations/p114_wan22_activation.py"
      - "src/operations/local_pipeline.py"
      - "src/operations/always_on_pipeline.py"
      - "src/operations/local_worker_v2.py"
      - "src/operations/local_onboarding_v2.py"
      - "scripts/windows/activate_p114_wan22.ps1"
      - "scripts/windows/supervise_local_production.ps1"
      - "scripts/windows/deploy_remote_content_automation.ps1"
      - "config/local-video-workflows/**"
      - "config/local.env.example"
      - "tests/unit/test_p113_video_pilot_contracts.py"
      - "tests/unit/test_p114_local_video_contracts.py"
      - "tests/unit/test_p114_wan22_production_contracts.py"
      - ".github/workflows/p114-local-video-renderers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p114-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: content_automation
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/content_automation
      DATABASE_REQUIRE_SCHEMA: false
      DATABASE_MIGRATIONS_DIR: migrations
      LOCAL_SUPER_ADMIN_OPERATOR_ID: local-super-admin
      LOCAL_ADMIN_OPERATOR_ID: local-admin
      LOCAL_REVIEWER_OPERATOR_ID: local-reviewer
      LOCAL_VIDEO_WORKER_OPERATOR_ID: local-video-worker
      LOCAL_PLAN_MONTH: 2026-08-01
      KOKORO_PRIMARY_VOICE: af_heart
      KOKORO_ENERGETIC_VOICE: af_bella
      KOKORO_SERIOUS_VOICE: am_adam
      OPS_ENVIRONMENT: staging
      OPS_MIGRATION_HEAD: 0108_p131_staged_acceptance_closeout.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Apply complete migration chain
        run: python -m src.infrastructure.database.cli migrate
      - name: Run operator and model policy onboarding twice
        run: |
          python -m src.operations.local_onboarding_v2
          python -m src.operations.local_onboarding_v2
          python -m src.operations.p113_model_policy_onboarding
      - name: Verify local clip schema and worker identity
        run: |
          python - <<'PY'
          from src.infrastructure.database.connection import Database
          from src.infrastructure.database.settings import get_database_settings

          database = Database(get_database_settings())
          database.open(require_schema=True)
          try:
              with database.connection() as conn:
                  constraint = conn.execute(
                      """SELECT pg_get_constraintdef(oid) AS definition
                           FROM pg_constraint
                           WHERE conrelid='football_brief.generation_jobs'::regclass
                             AND conname='generation_jobs_job_type_p114_check'"""
                  ).fetchone()
                  assert constraint and "local_clip" in constraint["definition"]
                  assert conn.execute(
                      "SELECT to_regclass('football_brief.local_video_workflows') AS value"
                  ).fetchone()["value"] is not None
                  assert conn.execute(
                      "SELECT to_regclass('football_brief.local_video_executions') AS value"
                  ).fetchone()["value"] is not None
                  worker = conn.execute(
                      """SELECT ou.id,ou.active,array_agg(our.role ORDER BY our.role) AS roles
                           FROM football_brief.operator_users ou
                           LEFT JOIN football_brief.operator_user_roles our ON our.operator_user_id=ou.id
                           WHERE ou.operator_id='local-video-worker'
                           GROUP BY ou.id,ou.active"""
                  ).fetchone()
                  assert worker and worker["active"] is True
                  assert worker["roles"] == ["producer"]
                  attempt_unique = conn.execute(
                      """SELECT count(*) AS value
                           FROM pg_constraint
                           WHERE conrelid='football_brief.local_video_executions'::regclass
                             AND contype='u'
                             AND pg_get_constraintdef(oid) ILIKE '%generation_attempt_id%'"""
                  ).fetchone()["value"]
                  assert attempt_unique == 1
          finally:
              database.close()
          PY
      - name: Focused P114 contracts
        run: >-
          python -m pytest -q
          tests/unit/test_p114_local_video_contracts.py
          tests/unit/test_p114_wan22_production_contracts.py
      - name: Existing queue, renderer, routing and pilot regressions
        run: >-
          python -m pytest -q
          tests/unit/test_p87_generation_job_contracts.py
          tests/unit/test_p93_renderer_contracts.py
          tests/unit/test_p94_routing_contracts.py
          tests/unit/test_p113_video_pilot_contracts.py
      - name: Safety boundary
        shell: bash
        run: |
          ! grep -R -n -E "automatic paid generation|automatic public publishing|external_cost_usd[^\n]*> 0" \
            src/application/local_video src/operations/local_video_worker.py src/operations/p114_wan22_activation.py migrations/0099_p114_local_video_renderers.sql
          ! grep -R -n 'client.post("/interrupt")' src/application/local_video src/operations/local_video_worker.py
          ! grep -n "VALUES ('video','ai_generated','approved'" src/operations/local_video_worker.py
          grep -q "P114_LOCAL_VIDEO_ENABLED=false" config/local.env.example
          grep -q "P114_WORKFLOW_ROOT=config/local-video-workflows" config/local.env.example
          grep -q '"hunyuan_enabled": false' config/local-video-workflows/wan22-ti2v-5b.manifest.json
          grep -q '"automatic_publishing": false' config/local-video-workflows/wan22-ti2v-5b.manifest.json
