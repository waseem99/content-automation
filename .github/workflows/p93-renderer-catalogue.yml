name: P93 Renderer Catalogue

on:
  pull_request:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      FOOTBALL_BRIEF_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.111" "httpx>=0.27" "pydantic>=2.7" "pydantic-settings>=2.3" "pytest>=8" "psycopg[binary]>=3.2,<4" "psycopg-pool>=3.2,<4" "typer>=0.12"
      - name: Compile renderer modules API and tests
        run: |
          python -m compileall -q \
            src/application/renderers \
            src/operator_api/renderers_runtime.py \
            src/operator_api/renderers_validated_runtime.py \
            src/operator_api/runtime_factory.py \
            tests/unit/test_p93_renderer_contracts.py \
            tests/integration/p93_renderer_support.py \
            tests/integration/test_p93_renderer_lifecycle.py \
            tests/integration/test_p93_renderer_managed_reprice.py \
            tests/integration/test_p93_renderer_api.py
      - name: Apply migrations
        run: |
          set -o pipefail
          { python -m src.infrastructure.database.cli migrate; python -m src.infrastructure.database.cli status; python -m src.infrastructure.database.cli health --json; } 2>&1 | tee p93-migrations.log
      - name: Run focused tests
        run: |
          set -o pipefail
          pytest -vv \
            tests/unit/test_p93_renderer_contracts.py \
            tests/integration/test_p93_renderer_lifecycle.py \
            tests/integration/test_p93_renderer_managed_reprice.py \
            tests/integration/test_p93_renderer_api.py \
            2>&1 | tee p93-tests.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p93-renderer-catalogue-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            p93-migrations.log
            p93-tests.log
