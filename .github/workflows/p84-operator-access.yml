name: P84 Operator Access

on:
  pull_request:
    branches: [test]
    paths:
      - ".github/workflows/p84-operator-access.yml"
      - "migrations/0029_operator_access_control.sql"
      - "migrations/README.md"
      - "src/operator_api/access.py"
      - "src/operator_api/access_runtime.py"
      - "src/operator_api/auth.py"
      - "src/operator_api/entrypoint.py"
      - "src/operator_api/runtime_factory.py"
      - "tests/unit/test_p84_operator_access.py"
      - "tests/integration/test_p84_operator_access_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_test
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.111" \
            "httpx>=0.27" \
            "pydantic>=2.7" \
            "pydantic-settings>=2.3" \
            "pytest>=8" \
            "psycopg[binary]>=3.2,<4" \
            "psycopg-pool>=3.2,<4" \
            "typer>=0.12"

      - name: Compile access modules and tests
        run: |
          python -m compileall -q \
            src/operator_api/access.py \
            src/operator_api/access_runtime.py \
            src/operator_api/auth.py \
            src/operator_api/entrypoint.py \
            src/operator_api/runtime_factory.py \
            tests/unit/test_p84_operator_access.py \
            tests/integration/test_p84_operator_access_runtime.py

      - name: Apply all migrations
        run: |
          python -m src.infrastructure.database.cli migrate
          python -m src.infrastructure.database.cli status

      - name: Run focused operator access contracts
        run: |
          pytest -q \
            tests/unit/test_p84_operator_access.py \
            tests/integration/test_p84_operator_access_runtime.py
