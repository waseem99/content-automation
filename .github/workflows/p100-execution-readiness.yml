name: P100 Execution Readiness

on:
  push:
    branches: [p100-execution-readiness]
  pull_request:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: p100-execution-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  execution-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_brief_readiness
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_brief_readiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_readiness
      FOOTBALL_BRIEF_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/football_brief_readiness
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115" "httpx>=0.27" "pydantic>=2.7" "pydantic-settings>=2.3" "pytest>=8" "psycopg[binary]>=3.2,<4" "psycopg-pool>=3.2,<4" "typer>=0.12"
      - name: Compile readiness service API and tests
        run: |
          python -m compileall -q \
            src/application/acceptance \
            src/operator_api/acceptance_readiness_runtime.py \
            src/operator_api/acceptance_runtime.py \
            src/operator_api/runtime_factory.py \
            tests/unit/test_p100_acceptance_contracts.py \
            tests/integration/test_p100_acceptance_foundation.py \
            tests/integration/test_p100_acceptance_configured_app.py \
            tests/integration/test_p100_acceptance_role_scope.py \
            tests/integration/test_p100_runbook_validation_drill.py \
            tests/integration/test_p100_execution_readiness.py
      - name: Apply and verify complete migration chain
        run: |
          set -o pipefail
          { python -m src.infrastructure.database.cli migrate; python -m src.infrastructure.database.cli status; python -m src.infrastructure.database.cli health --json; } 2>&1 | tee p100-execution-readiness-migrations.log
      - name: Run readiness and P100 regressions
        run: |
          set -o pipefail
          pytest -vv \
            tests/unit/test_p100_acceptance_contracts.py \
            tests/integration/test_p100_acceptance_foundation.py \
            tests/integration/test_p100_acceptance_configured_app.py \
            tests/integration/test_p100_acceptance_role_scope.py \
            tests/integration/test_p100_runbook_validation_drill.py \
            tests/integration/test_p100_execution_readiness.py \
            2>&1 | tee p100-execution-readiness-tests.log
      - name: Prove readiness route is read only and deployment neutral
        run: |
          ! grep -n -E '@app\.(post|put|patch|delete)' src/operator_api/acceptance_readiness_runtime.py
          ! grep -R -n -E "execute_live_deliver[y]|submit_live_deliver[y]|provider\.submit|vercel depl[o]y|vercel --pr[o]d|docker pus[h]|kubectl appl[y]|gh release creat[e]" \
            src/operator_api/acceptance_readiness_runtime.py \
            tests/integration/test_p100_execution_readiness.py \
            .github/workflows/p100-execution-readiness.yml
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p100-execution-readiness-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            p100-execution-readiness-migrations.log
            p100-execution-readiness-tests.log
