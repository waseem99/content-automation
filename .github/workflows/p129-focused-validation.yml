name: P129 Focused Validation
on:
  push:
    branches: [validation/p129-42cf]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: content_automation
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d content_automation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/content_automation
      DATABASE_REQUIRE_SCHEMA: "false"
      DATABASE_MIGRATIONS_DIR: migrations
      DATABASE_STATEMENT_TIMEOUT_MS: "600000"
      LOCAL_SUPER_ADMIN_OPERATOR_ID: local-super-admin
      LOCAL_ADMIN_OPERATOR_ID: local-admin
      LOCAL_REVIEWER_OPERATOR_ID: local-reviewer
      LOCAL_PLAN_MONTH: 2026-08-01
      LOCAL_ARTIFACT_ROOT: .runtime/artifacts
      PORTFOLIO_MEDIA_ROOT: .runtime/artifacts
      LOCAL_RUNTIME_ROOT: .runtime
      KOKORO_PRIMARY_VOICE: af_heart
      KOKORO_ENERGETIC_VOICE: af_bella
      KOKORO_SERIOUS_VOICE: am_adam
      OPS_ENVIRONMENT: staging
      OPS_MIGRATION_HEAD: 0106_p129_storage_scale_recovery.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src/application/campaign_storage src/operations/storage_scale_acceptance.py src/operations/storage_scale_acceptance_entry.py
      - run: python -m src.infrastructure.database.cli migrate
      - run: |
          python -m src.operations.local_onboarding_v2
          python -m src.operations.local_onboarding_v2
      - name: Full 100k-location acceptance
        run: >-
          python -m src.operations.storage_scale_acceptance_entry
          --assets 50000 --locations 100000
          --acceptance-key "p129-focused-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Verify retained evidence
        run: |
          python - <<'PY'
          from src.infrastructure.database.connection import Database
          from src.infrastructure.database.settings import get_database_settings
          db=Database(get_database_settings()); db.open(require_schema=True)
          try:
            with db.connection() as c:
              r=c.execute("SELECT * FROM football_brief.storage_scale_acceptance_runs ORDER BY created_at DESC LIMIT 1").fetchone()
            assert r['status']=='passed'; assert r['retained_assets']==50000; assert r['retained_locations']==100000
            assert r['duplicate_locations']==0; assert r['mismatches_detected']>=1; assert r['missing_detected']>=1
            assert r['recovered_local_copies']>=1; assert r['canonical_identity_changes']==0
            assert r['drive_outage_local_failures']==0
          finally: db.close()
          PY
      - run: python -m pytest -q tests/unit/test_p129_storage_scale_contracts.py
