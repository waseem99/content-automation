name: Local Facebook reference verification

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: Public Facebook page URL
        required: true
        default: https://www.facebook.com/RawrNationTV
      brand:
        description: Brand slug
        required: true
        default: rawr-nation
      limit:
        description: Number of recent videos
        required: true
        default: "3"
  push:
    branches:
      - test
    paths:
      - .github/workflows/facebook-reference-local.yml

permissions:
  contents: write

concurrency:
  group: facebook-reference-local
  cancel-in-progress: false

jobs:
  analyze:
    name: Download and verify Facebook references locally
    runs-on: [self-hosted, Windows, X64, facebook-media]
    timeout-minutes: 75
    defaults:
      run:
        shell: powershell
    env:
      ENGINE_RECOVERY_REVISION: "4"
      EVIDENCE_SYNC_REVISION: "5"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out verified development code
        uses: actions/checkout@v4
        with:
          ref: local-next-720
          persist-credentials: false

      - name: Configure private local storage
        run: |
          "REFINTEL_WORKSPACE=$env:USERPROFILE\content-automation-data\references" | Add-Content $env:GITHUB_ENV
          "REFINTEL_FACEBOOK_PROFILE=$env:USERPROFILE\content-automation-data\facebook-browser" | Add-Content $env:GITHUB_ENV

      - name: Verify local runtime
        run: |
          python --version
          ffmpeg -version | Select-Object -First 1
          if (-not (Test-Path $env:REFINTEL_FACEBOOK_PROFILE)) {
            throw "Facebook browser profile is missing: $env:REFINTEL_FACEBOOK_PROFILE"
          }
          New-Item -ItemType Directory -Force -Path $env:REFINTEL_WORKSPACE | Out-Null

      - name: Install the local reference engine
        run: python -m pip install --disable-pip-version-check -e ./reference-engine

      - name: Download, analyze, and verify references
        env:
          PAGE_URL: ${{ inputs.page_url || 'https://www.facebook.com/RawrNationTV' }}
          BRAND: ${{ inputs.brand || 'rawr-nation' }}
          VIDEO_LIMIT: ${{ inputs.limit || '3' }}
        run: |
          $started = Get-Date
          python -m refintel.cli facebook-page $env:PAGE_URL `
            --brand $env:BRAND `
            --rights public-internal-research `
            --limit ([int]$env:VIDEO_LIMIT) `
            --headed `
            --no-local-vision `
            --transcription-model small `
            --transcription-device cpu

          $latest = Get-ChildItem "$env:REFINTEL_WORKSPACE\page-runs" -Directory |
            Where-Object { $_.LastWriteTime -ge $started } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $latest) { throw "No new Facebook page run was produced." }

          $resultPath = Join-Path $latest.FullName "batch-result.json"
          if (-not (Test-Path $resultPath)) { throw "batch-result.json is missing." }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          $expected = [int]$env:VIDEO_LIMIT

          @"
          ## Facebook reference verification

          - Run: $($result.run_id)
          - Attempted: $($result.summary.attempted)
          - Verified media: $($result.summary.verified_media)
          - Analyzed: $($result.summary.analyzed)
          - Failed: $($result.summary.failed)
          - Local evidence: `$($latest.FullName)`
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

          if ($result.summary.attempted -ne $expected -or
              $result.summary.verified_media -ne $expected -or
              $result.summary.analyzed -ne $expected -or
              $result.summary.failed -ne 0) {
            $result.results | ConvertTo-Json -Depth 6
            throw "Facebook evidence gate failed. Review the sanitized errors above."
          }

          Write-Host "VERIFIED: $expected downloaded videos contain complete analysis evidence."

      - name: Sync sanitized evidence to the private review branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $latest = Get-ChildItem "$env:REFINTEL_WORKSPACE\page-runs" -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $result = Get-Content (Join-Path $latest.FullName "batch-result.json") -Raw | ConvertFrom-Json
          $references = @()
          foreach ($item in $result.results) {
            $artifactDir = Join-Path (Join-Path $latest.FullName "analysis") $item.reference_id
            $analysisPath = Join-Path $artifactDir "reference_analysis.json"
            $fingerprintPath = Join-Path $artifactDir "reference_fingerprint.json"
            $transcriptPath = Join-Path $artifactDir "transcript.txt"
            $references += @{
              id = $item.reference_id
              index = $item.index
              source_url = $item.url
              status = $item.status
              duration_seconds = $item.duration_seconds
              decoded_frame_count = $item.decoded_frame_count
              scene_count = $item.scene_count
              transcript_segment_count = $item.transcript_segment_count
              analysis = if (Test-Path $analysisPath) { Get-Content $analysisPath -Raw | ConvertFrom-Json } else { $null }
              creative_fingerprint = if (Test-Path $fingerprintPath) { Get-Content $fingerprintPath -Raw | ConvertFrom-Json } else { $null }
              transcript = if (Test-Path $transcriptPath) { Get-Content $transcriptPath -Raw } else { "" }
            }
          }
          $payload = @{
            schema_version = "p80.static_reference_evidence.v1"
            brand = "rawr-nation"
            generated_at = (Get-Date).ToUniversalTime().ToString("o")
            run_id = $result.run_id
            summary = $result.summary
            references = $references
            security = @{ source_media_included = $false; cookies_included = $false; browser_profile_included = $false }
          } | ConvertTo-Json -Depth 30
          $target = "web/static-creator-ui/data/rawr-nation-reference-evidence.json"
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$target"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $existingSha = $null
          try { $existingSha = (Invoke-RestMethod -Headers $headers -Uri "$api?ref=local-next-720").sha } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          $body = @{ message = "Sync sanitized Rawr Nation reference evidence"; content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($payload)); branch = "local-next-720" }
          if ($existingSha) { $body.sha = $existingSha }
          Invoke-RestMethod -Method Put -Headers $headers -Uri $api -Body ($body | ConvertTo-Json) -ContentType "application/json" | Out-Null
          Write-Host "Sanitized reference evidence synced without source media, cookies, or browser data."
