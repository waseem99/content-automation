name: P101 P103 Local Operator Runtime

on:
  pull_request:
    branches: [test]
    paths:
      - "src/operator_api/**"
      - "src/operations/local_*"
      - "web/static-creator-ui/**"
      - "compose.local.yml"
      - "config/local.env.example"
      - "video-engine/voice-requirements.txt"
      - "scripts/local_golden_path_smoke.py"
      - "scripts/windows/start_local_production.ps1"
      - "scripts/windows/stop_local_production.ps1"
      - "docs/operations/LOCAL_PRODUCTION_RUNBOOK.md"
      - "README.md"
      - "tests/unit/test_p100_controlled_snapshot_studio_contracts.py"
      - "tests/unit/test_p101_*"
      - "tests/unit/test_p103_*"
      - ".github/workflows/p101-p103-local-operator-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p101-p103-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q src tests scripts/local_golden_path_smoke.py
      - name: JavaScript syntax
        run: |
          node --check web/static-creator-ui/assets/studio-v2-api.js
          node --check web/static-creator-ui/assets/studio-v2.js
          node --check web/static-creator-ui/assets/studio-v2-media.js
          node --check web/static-creator-ui/assets/studio-v2-extensions.js
          node --check web/static-creator-ui/assets/studio-v2-queue.js
          node --check web/static-creator-ui/assets/studio-v2-p100-snapshot.js
      - name: Creator Studio v2 contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv tests/unit/test_p101_creator_studio_v2_contracts.py 2>&1 | tee p101-studio.log
      - name: P100 snapshot Studio contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv tests/unit/test_p100_controlled_snapshot_studio_contracts.py 2>&1 | tee p100-snapshot-studio.log
      - name: Local runtime contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv tests/unit/test_p101_p103_local_runtime_contracts.py 2>&1 | tee p101-runtime.log
      - name: Role-aware sign-in contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv tests/unit/test_p101_role_aware_studio_signin.py 2>&1 | tee p101-roles.log
      - name: Local alignment contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv tests/unit/test_p101_local_audio_alignment.py 2>&1 | tee p101-alignment.log
      - name: Local onboarding contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv tests/unit/test_p103_local_onboarding_contracts.py 2>&1 | tee p103-onboarding.log
      - name: Upload focused logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p101-p103-focused-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            p101-studio.log
            p100-snapshot-studio.log
            p101-runtime.log
            p101-roles.log
            p101-alignment.log
            p103-onboarding.log
      - name: No deployment, automatic approval, or live publishing
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path("src/operations/local_onboarding.py"),
              Path("src/operations/local_worker.py"),
              Path("src/operations/local_audio_alignment_patch.py"),
              Path("src/operator_api/studio_v2_runtime.py"),
              Path("src/operator_api/studio_v2_media_runtime.py"),
              Path("src/operator_api/studio_v2_schema_patch.py"),
              Path("src/operator_api/acceptance_controlled_snapshot_runtime.py"),
              Path("web/static-creator-ui/assets/studio-v2.js"),
              Path("web/static-creator-ui/assets/studio-v2-extensions.js"),
              Path("web/static-creator-ui/assets/studio-v2-queue.js"),
              Path("web/static-creator-ui/assets/studio-v2-p100-snapshot.js"),
              Path("scripts/windows/start_local_production.ps1"),
              Path("scripts/windows/stop_local_production.ps1"),
              Path("compose.local.yml"),
          ]
          blocked = re.compile(
              r"\bvercel\s+(?:deploy|--prod)\b|"
              r"\bdocker\s+push\b|"
              r"\bkubectl\s+apply\b|"
              r"\bterraform\s+apply\b|"
              r"\blive[_ -]publish(?:ing)?\s*[:=]\s*(?:true|1)\b|"
              r"\bautomatic[_ -](?:approve|approval|publish|publishing)\s*[:=]\s*(?:true|1)\b",
              re.IGNORECASE,
          )
          violations = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if blocked.search(line):
                      violations.append(f"{path}:{line_number}:{line.strip()}")
          if violations:
              raise SystemExit("Blocked deployment or publishing command found:\n" + "\n".join(violations))
          PY
