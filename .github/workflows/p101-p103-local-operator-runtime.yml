name: P101 P103 Local Operator Runtime

on:
  pull_request:
    branches: [test]
    paths:
      - "src/operator_api/**"
      - "src/operations/local_*"
      - "web/static-creator-ui/**"
      - "compose.local.yml"
      - "config/local.env.example"
      - "config/ngrok.local.example.yml"
      - "scripts/local_golden_path_smoke.py"
      - "scripts/windows/start_local_production.ps1"
      - "scripts/windows/stop_local_production.ps1"
      - "docs/operations/LOCAL_PRODUCTION_RUNBOOK.md"
      - "README.md"
      - "tests/unit/test_p101_*"
      - "tests/unit/test_p103_*"
      - ".github/workflows/p101-p103-local-operator-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p101-p103-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q src tests scripts/local_golden_path_smoke.py
      - name: JavaScript syntax
        run: |
          node --check web/static-creator-ui/assets/studio-v2-api.js
          node --check web/static-creator-ui/assets/studio-v2.js
          node --check web/static-creator-ui/assets/studio-v2-media.js
      - name: Focused contracts
        run: >
          python -m pytest -q
          tests/unit/test_p101_creator_studio_v2_contracts.py
          tests/unit/test_p101_p103_local_runtime_contracts.py
          tests/unit/test_p101_role_aware_studio_signin.py
          tests/unit/test_p103_local_onboarding_contracts.py
      - name: No deployment or live publishing
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path("src/operations/local_onboarding.py"),
              Path("src/operations/local_worker.py"),
              Path("src/operator_api/studio_v2_runtime.py"),
              Path("src/operator_api/studio_v2_media_runtime.py"),
              Path("web/static-creator-ui/assets/studio-v2.js"),
              Path("scripts/windows/start_local_production.ps1"),
              Path("scripts/windows/stop_local_production.ps1"),
              Path("compose.local.yml"),
          ]
          blocked = re.compile(
              r"\bvercel\s+(?:deploy|--prod)\b|"
              r"\bdocker\s+push\b|"
              r"\bkubectl\s+apply\b|"
              r"\bterraform\s+apply\b|"
              r"\blive[_ -]publish\b|"
              r"\bautomatic[_ -]publish\b",
              re.IGNORECASE,
          )
          violations = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if blocked.search(line):
                      violations.append(f"{path}:{line_number}:{line.strip()}")
          if violations:
              raise SystemExit("Blocked deployment or publishing command found:\n" + "\n".join(violations))
          PY
